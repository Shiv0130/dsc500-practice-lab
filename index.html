const idbGet = k => new Promise((res, rej) => { const q = DB.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
const idbPut = (k, v) => new Promise((res, rej) => { const t = DB.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
let lastBackup = 0;
function writeNow() {
  clearTimeout(saveT); saveT = null; const json = JSON.stringify(S);
  try { localStorage.setItem(KEY2, json); ST.last = Date.now(); } catch (e) { ST.err = "localStorage: " + e.message; }
  if (DB) { idbPut("state", JSON.parse(json)).then(() => { ST.idb = true; ST.last = Date.now(); }).catch(e => { ST.err = "IndexedDB: " + (e && e.message); });
    if (Date.now() - lastBackup > 60000) { lastBackup = Date.now(); idbPut("backup", JSON.parse(json)).catch(() => {}); } }
}
const save = () => { S.ts = Date.now(); if (!saveT) saveT = setTimeout(writeNow, 300); };  // autosave: debounced 300 ms after every change
window.addEventListener("pagehide", () => { if (saveT) writeNow(); });

const storageReady = (async () => {

    let st = null; try { st = await idbGet("state"); } catch (e) {}

/* ---------- Python (Pyodide) ---------- */
const PY = { p: null, boot: null, chain: Promise.resolve(), loaded: new Set() };
const pyChip = (t, cls) => { const c = $("#pyChip"); c.textContent = t; c.className = "chip " + (cls || ""); };
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("Could not load " + src)); document.head.appendChild(s); }); }
PY.start = function () {
  if (PY.boot) return PY.boot;
  pyChip("⏳ Py", "warn");
  PY.boot = (async () => {
    await loadScript("https://cdn.jsdelivr.net/pyodide/v0.29.5/full/pyodide.js");
    const p = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.29.5/full/" });
    for (const f of DATA_FILES) p.FS.writeFile(f, window.DATA[f]);
    p.FS.writeFile("harness.py", window.HARNESS_PY);
    p.runPython("import sys, os; sys.path.insert(0, os.getcwd()); import harness");
    PY.p = p; pyChip("✅ Py", "ok"); return p;
  })().catch(e => { pyChip("⚠️ Py ↻", "warn"); PY.boot = null; throw e; });
  return PY.boot;
};
const PKG = { numpy: "numpy", pandas: "pandas", matplotlib: "matplotlib", sklearn: "scikit-learn", bs4: "beautifulsoup4" };
function needed(code) {
  const out = new Set(); const re = /^\s*(?:from|import)\s+([A-Za-z_0-9]+)/gm; let m;
  while ((m = re.exec(code))) if (PKG[m[1]]) out.add(PKG[m[1]]);
  if (/matplotlib/.test(code)) out.add("matplotlib");
  return [...out];
}
PY.loadPkgs = async function (names, cb) {
  const p = await PY.start(); const todo = names.filter(n => !PY.loaded.has(n));
  if (todo.length) { await p.loadPackage(todo, { messageCallback: cb, errorCallback: cb }); todo.forEach(n => PY.loaded.add(n)); }
};
PY.run = function (code, cb, extra) {
  const job = PY.chain.then(async () => {
    cb && cb("Starting Python…"); await PY.start();
    await PY.loadPkgs([...new Set([...needed(code), ...(extra || [])])], t => cb && cb(t));
    cb && cb("Running…");
    PY.p.globals.set("_code", code);
    return JSON.parse(PY.p.runPython("import json, harness\njson.dumps(harness.run(_code))"));
  });
  PY.chain = job.catch(() => {});
  return job;
};
PY.grade = function (code, tests, extra, cb) {  // run the student's code, then the hidden tests; returns {out,error,images,checks}
  const job = PY.chain.then(async () => {
    cb && cb("Starting Python…"); await PY.start();
    await PY.loadPkgs([...new Set([...needed(code), ...(extra || []), "numpy", "pandas"])], t => cb && cb(t));
    cb && cb("Running your code and the hidden tests…");
    PY.p.globals.set("_code", code); PY.p.globals.set("_tests", JSON.stringify(tests));
    return JSON.parse(PY.p.runPython("import json, harness\njson.dumps(harness.grade(_code, json.loads(_tests)))"));
  });
  PY.chain = job.catch(() => {});
  return job;
};

/* ---------- quiz / lesson runner (Brilliant + SoloLearn style) ---------- */
function runQuiz(el, items, o) {
  let i = 0, att = 0, shown = 0, picked = null, seq = [], pool = [], okN = 0;
  const total = items.length;
  const pct = () => Math.round(i / total * 100);
  function head() { return `<div class="pbar"><i style="width:${pct()}%"></i></div><div class="muted">${o.title} · card ${Math.min(i + 1, total)} of ${total}</div>`; }
  function render() {
    if (i >= total) return done();
    const it = items[i]; att = 0; shown = 0; picked = null; seq = [];
    let h = head() + '<div class="qcard">';
    if (it.type === "learn") h += `<h3>${it.title}</h3>${it.html}${vis(it.vis)}<button class="big" data-q="next">Continue</button>`;
    else if (it.type === "code") { const sn = findSnip(it.snippet); h += `<h3>▶ ${esc(it.title)}</h3><p class="muted">${sn.desc}</p>${editor("q-" + sn.id, sn.code)}<button class="big sec" data-q="next">Continue</button>`; }
    else {
      h += `<div class="q">${it.q}</div>${vis(it.vis)}`;
      if (it.code) h += `<pre class="out" style="white-space:pre-wrap">${esc(it.code)}</pre>`;
      if (it.type === "mcq") h += it.choices.map((c, k) => `<button class="choice" data-q="pick" data-k="${k}">${c}</button>`).join("");
      if (it.type === "num") h += `<input class="ans" inputmode="decimal" autocomplete="off" autocapitalize="off" placeholder="Type your answer (e.g. 0.25 or 1/4)">`;
      if (it.type === "fill") h += `<pre class="out" style="white-space:pre-wrap">${esc(it.code)}</pre><input class="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type what goes in the blank">`;
      if (it.type === "order") { pool = it.lines.map((l, k) => k).sort(() => Math.random() - .5); if (pool.every((v, k) => v === k)) pool.reverse(); h += `<div class="muted">Tap the lines in the right order. Tap a placed line to take it back.</div><div class="slots" data-r="slots"></div><div class="chips-o" data-r="pool"></div>`; }
      if (it.hint) h += `<details class="hint"><summary>💡 Hint</summary><p>${it.hint}</p></details>`;
      h += `<div class="fb-slot"></div><button class="big" data-q="check">Check</button>`;
    }
    el.innerHTML = h + "</div>"; fitAll(el); if (it.type === "order") drawOrder();
  }
  function drawOrder() {
    const it = items[i];
    $('[data-r=slots]', el).innerHTML = seq.map(k => `<button class="chipo in" data-q="unplace" data-k="${k}">${esc(it.lines[k])}</button>`).join("") || '<span class="muted">(empty)</span>';
    $('[data-r=pool]', el).innerHTML = pool.filter(k => !seq.includes(k)).map(k => `<button class="chipo" data-q="place" data-k="${k}">${esc(it.lines[k])}</button>`).join("");
  }
  function parseNum(s) { s = s.trim().replace(/,/g, "").replace(/\s/g, ""); let pc = /%$/.test(s); s = s.replace(/%$/, ""); let v; if (/^-?[\d.]+\/[\d.]+$/.test(s)) { const [a, b] = s.split("/"); v = parseFloat(a) / parseFloat(b); } else v = Number(s); if (pc) v /= 100; return v; }
  function stepsBtn(it) { return it.steps ? `<ul class="steps" data-r="steps"></ul><button class="sec" data-q="step">▶ Show the working, step by step</button>` : ""; }
  function finish(it, ok, why) {
    const slot = $(".fb-slot", el); const gain = ok ? (att === 1 ? 10 : 5) : 0; if (gain) addXP(gain);
    slot.innerHTML = `<div class="fb ${ok ? "ok" : "info"}"><b>${ok ? "✅ Correct! +" + gain + " XP" : "Here is the answer"}</b><br>${why}</div>${stepsBtn(it)}`;
    $('[data-q=check]', el).outerHTML = `<button class="big" data-q="next">${i + 1 >= total ? "Finish" : "Continue"}</button>`;
    $$(".choice", el).forEach((b, k) => { b.disabled = true; if (it.type === "mcq" && k === it.answer) b.classList.add("ok"); });
  }
  function check() {
    const it = items[i]; let ok = false;
    if (it.type === "mcq") { if (picked == null) return toast("Pick an answer first"); ok = picked === it.answer; }
    else if (it.type === "num") { const v = parseNum($(".ans", el).value); if (isNaN(v)) return toast("Type a number or a fraction like 1/4"); ok = Math.abs(v - (typeof it.answer === "string" ? parseNum(it.answer) : it.answer)) <= (it.tol || .006); }
    else if (it.type === "fill") { const v = $(".ans", el).value.trim(); if (!v) return toast("Type your answer"); ok = it.answers.some(a => a === v || a.replace(/["']/g, "") === v.replace(/["']/g, "")); }
    else if (it.type === "order") { if (seq.length < it.lines.length) return toast("Place all the lines first"); ok = seq.every((k, n) => k === n); }
    att++;
    if (ok) { right(); okN++; finish(it, true, it.why); return; }
    wrong();
    if (att >= 2) { finish(it, false, (it.type === "num" ? "Answer: <b>" + (typeof it.answer === "string" ? it.answer : it.answer) + "</b><br>" : it.type === "fill" ? "Answer: <code>" + esc(it.answers[0]) + "</code><br>" : it.type === "order" ? "Correct order:<ol>" + it.lines.map(l => `<li><code>${esc(l)}</code></li>`).join("") + "</ol>" : "") + it.why); return; }
    $(".fb-slot", el).innerHTML = `<div class="fb no"><b>Not quite.</b> Streak reset. Open the 💡 hint and try once more.</div>`;
    const d = $("details.hint", el); if (d) d.open = true;
    if (it.type === "mcq") { $$(".choice", el)[picked].classList.remove("sel"); $$(".choice", el)[picked].classList.add("no"); picked = null; }
    if (it.type === "order") { seq = []; drawOrder(); }
  }
  function toast(t) { $(".fb-slot", el).innerHTML = `<div class="fb info">${t}</div>`; }
  function done() {
    S.done[o.qid] = true; S.scores[o.qid] = { ok: okN, total: total }; save(); addXP(20); buildNav();
    el.innerHTML = `<div class="pbar"><i style="width:100%"></i></div><div class="qcard"><h3>🎉 ${o.title}: complete! +20 XP</h3><p>Total XP: <b>${S.xp}</b> · best streak: <b>${S.best}</b></p><div class="row"><button data-q="again">↺ Do it again</button><button class="sec" data-q="exit">Back</button></div></div>`;
  }
  el.onclick = e => {
    const b = e.target.closest("[data-q]"); if (!b || !el.contains(b)) return; const a = b.dataset.q;
    if (a === "next") { i++; render(); el.scrollIntoView({ block: "start", behavior: "smooth" }); }
    else if (a === "pick") { picked = +b.dataset.k; $$(".choice", el).forEach(x => x.classList.remove("sel")); b.classList.add("sel"); }
    else if (a === "check") check();
    else if (a === "place") { seq.push(+b.dataset.k); drawOrder(); }
    else if (a === "unplace") { seq = seq.filter(k => k !== +b.dataset.k); drawOrder(); }
    else if (a === "step") { const it = items[i], ul = $('[data-r=steps]', el); if (shown < it.steps.length) { ul.insertAdjacentHTML("beforeend", `<li>${it.steps[shown++]}</li>`); } if (shown >= it.steps.length) b.remove(); else b.textContent = `▶ Next step (${shown}/${it.steps.length})`; }
    else if (a === "again") { i = 0; okN = 0; render(); }
    else if (a === "exit") { o.onExit && o.onExit(); }
  };
  el.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("input.ans")) { const c = $('[data-q=check]', el); if (c) c.click(); } });
  render();
}

document.addEventListener("click", e => {

  const host = b.closest("[data-ppx]"); if (!host || !["pprule", "ppchoice", "ppchk", "pphint", "pprev", "ppreset"].includes(f)) return; const p = PPX[host.dataset.ppx], st = ppState(p), stepEl = b.closest(".pstep"), k = stepEl && stepEl.dataset.k, steps = st.steps;
  if (f === "pprule" || f === "ppchoice") { const s = steps[k] || (steps[k] = {}); s.v = f === "pprule" ? b.dataset.r : b.dataset.k; save(); $$(".choice", stepEl).forEach(x => x.classList.remove("sel")); b.classList.add("sel"); return; }
  if (f === "ppreset") { if (!confirm("Start this problem over?")) return; st.steps = {}; Object.assign(st, { solved: false, best: 0, fails: 0, hints: 0, tries: 0 }); save(); ppRefresh(host); return; }
  const L = LV[lvKey(p.level)], idx = PSTEPS.findIndex(x => x[0] === k), s = steps[k] || (steps[k] = {});
  if (f === "pphint") { if (FX.locked("hint")) return; FX.hint(p.id); if (!s.hn) { s.hn = 1; st.hints++; } save(); ppRefresh(host); return; }
  if (f === "pprev") { if (FX.locked("solution")) return; FX.peek(p.id); s.rev = true; save(); finishPP(p, st); ppRefresh(host); return; }
  if (f === "ppchk") {
    if (FX.locked("check")) return; if (s.v == null || s.v === "") { s.msg = k === "rule" ? "Pick a rule first." : "Type your answer first."; ppRefresh(host); return; }
    const r = stepCheck(p, k, s.v); s.att = (s.att || 0) + 1; st.tries++; st.ts = nowMs();
    if (r.ok) { s.ok = true; s.msg = ""; right(); } else { s.msg = r.why; st.fails++; wrong(); }
    st.best = Math.max(st.best || 0, ppEarned(p, steps)); finishPP(p, st); save(); ppRefresh(host);
  }
});

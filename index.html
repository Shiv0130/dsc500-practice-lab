<style>*{box-sizing:border-box}

.pbar{height:10px;background:#e5e7eb;border-radius:6px;overflow:hidden;margin:6px 0}.pbar i{display:block;height:100%;background:#04aa6d;transition:width .3s}

.qcard{background:#fff;border:2px solid #dde1e6;border-radius:16px;padding:14px;margin:10px 0}

.choice{display:block;width:100%;text-align:left;background:#fff;color:#1f2933;border:2px solid #cbd2d9;min-height:50px;margin:8px 0;font-weight:500;font-size:16px;overflow-wrap:anywhere}

.steps{margin:8px 0;padding:0;list-style:none;counter-reset:s}.steps li{counter-increment:s;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:6px 10px 6px 34px;margin:5px 0;position:relative;animation:pop .25s}

.slots{background:#f8fafc;border:2px dashed #94a3b8;border-radius:10px;padding:6px;min-height:60px;display:flex;flex-direction:column;gap:6px}
.vis{margin:8px 0;text-align:center}.vis svg{max-width:100%;height:auto}
.lessons{display:grid;gap:8px}

.home-grid{display:grid;grid-template-columns:1fr;gap:8px}.home-grid a{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid #d6dae0;border-radius:12px;padding:10px 12px;color:inherit;text-decoration:none;min-height:56px}
.home-grid a small{display:block;color:#6b7280;font-size:12.5px}
.oos{background:#fef2f2;border:1px solid #fca5a5;border-radius:10px;padding:8px 12px;font-size:14px}

label.btn.filebtn{display:flex;align-items:center;justify-content:center;flex:1 1 130px;min-height:46px;padding:8px 16px;border-radius:8px;background:#e5e7eb;color:#1f2933;font-weight:600;cursor:pointer;position:relative;overflow:hidden}

.solbox pre.out{max-height:420px;overflow:auto}

      if (it.type === "num") h += `<input class="ans" inputmode="decimal" autocomplete="off" autocapitalize="off" placeholder="Type your answer (e.g. 0.25 or 1/4)">`;
      if (it.type === "fill") h += `<pre class="out" style="white-space:pre-wrap">${esc(it.code)}</pre><input class="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type what goes in the blank">`;

  }

    $('[data-r=pool]', el).innerHTML = pool.filter(k => !seq.includes(k)).map(k => `<button class="chipo" data-q="place" data-k="${k}">${esc(it.lines[k])}</button>`).join("");
  }
  function parseNum(s) { s = s.trim().replace(/,/g, "").replace(/\s/g, ""); let pc = /%$/.test(s); s = s.replace(/%$/, ""); let v; if (/^-?[\d.]+\/[\d.]+$/.test(s)) { const [a, b] = s.split("/"); v = parseFloat(a) / parseFloat(b); } else v = Number(s); if (pc) v /= 100; return v; }

    slot.innerHTML = `<div class="fb ${ok ? "ok" : "info"}"><b>${ok ? "✅ Correct! +" + gain + " XP" : "Here is the answer"}</b><br>${why}</div>${stepsBtn(it)}`;
    $('[data-q=check]', el).outerHTML = `<button class="big" data-q="next">${i + 1 >= total ? "Finish" : "Continue"}</button>`;
